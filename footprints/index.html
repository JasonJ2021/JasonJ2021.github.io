<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Footprints · Jason Sun</title>
    <meta name="description" content="Every city Jason Sun has been to, lit up on a map.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0f1a'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23ffb547'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23ffb547' stroke-opacity='.35' stroke-width='3'/%3E%3C/svg%3E">
    <script>
      (() => {
        let t = "system";
        try { const v = localStorage.getItem("site-theme"); if (v === "light" || v === "dark") t = v; } catch {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="../assets/vendor/leaflet.css">
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="stylesheet" href="footprints.css">
  </head>
  <body>
    <header class="statusbar">
      <a class="who" href="../"><span class="live-dot" aria-hidden="true"></span>jasonsun<span class="path">~/footprints</span></a>
      <div class="right">
        <span data-clock aria-label="Shanghai time"></span>
        <div class="theme-switcher" role="group" aria-label="Theme">
          <button type="button" data-theme-option="light">light</button>
          <button type="button" data-theme-option="dark">dark</button>
          <button type="button" data-theme-option="system">auto</button>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="head">
        <div>
          <a class="back mono" href="../">← cd ..</a>
          <h1>Footprints<span class="dot">.</span></h1>
          <p class="lede">Cities I've visited are shaded orange, with every stop lighting up the map.</p>
        </div>
        <dl class="stats" id="stats"></dl>
      </section>

      <div class="toolbar">
        <div class="seg" role="group" aria-label="Layer">
          <button type="button" data-layer="both" aria-pressed="true">lights + heat</button>
          <button type="button" data-layer="dots" aria-pressed="false">lights</button>
          <button type="button" data-layer="heat" aria-pressed="false">heat</button>
        </div>
        <label class="year-filter mono">
          year
          <select id="year"><option value="">all</option></select>
        </label>
      </div>

      <div class="map-layout">
        <div class="map-panel">
          <div id="map" class="map" role="region" aria-label="Footprints map"></div>
          <p class="boundary-status mono" id="boundary-status" role="status" hidden></p>
        </div>
        <aside class="places-panel" aria-labelledby="places-heading">
          <h2 id="places-heading">Cities visited</h2>
          <section class="places" id="places" aria-label="City list"></section>
        </aside>
      </div>

      <footer class="footer">
        <span>© <span data-year></span> Jason Sun</span>
        <span>data: data/footprints.json</span>
      </footer>
    </main>

    <script src="../assets/vendor/leaflet.js"></script>
    <script src="../assets/vendor/leaflet-heat.js"></script>
    <script src="../assets/site.js"></script>
    <script src="../assets/footmap.js"></script>
    <script src="boundaries.js"></script>
    <script src="footprints.js"></script>
  </body>
</html>
